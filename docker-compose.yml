version: "3.9"

services:
    app:
        build: .
        container_name: stremio-addon
        restart: unless-stopped
        ports:
            - "7000:7000"
        env_file:
            - .env.docker
        environment:
            - NODE_ENV=production
        depends_on:
            - jackett
            - redis

    jackett:
        image: lscr.io/linuxserver/jackett:latest
        container_name: jackett
        restart: unless-stopped
        ports:
            - "9117:9117"
        volumes:
            - ./jackett/config:/config
            - ./jackett/downloads:/downloads
        environment:
            - PUID=1000
            - PGID=1000
            - AUTO_UPDATE=true
            - TZ=Asia/Karachi

    redis:
        image: redis:7-alpine
        container_name: redis
        ports:
            - "6379:6379"
        restart: unless-stopped
        volumes:
            - redis-data:/data

volumes:
    redis-data:
